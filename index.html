<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таймер та Секундомір</title>
    <link rel="manifest" href="sport-clock-manifest.json">
    <link rel="icon" href="icon-192.png">
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sport Clock">
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #fff; --muted: #aaa; --work: #4caf50; --rest: #2196f3; }
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px 15px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 600px; text-align: center; }
        .status-badge { font-size: 1.25rem; font-weight: bold; margin-bottom: 8px; padding: 6px 25px; border-radius: 30px; display: block; width: 100%; text-align: center; text-transform: uppercase; background: #333; color: var(--muted); }
        .status-badge.work-active { background: var(--work); color: #000; }
        .status-badge.rest-active { background: var(--rest); color: #000; }
        .status-badge.paused { background: #ff9800; color: #000; }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; background: var(--card); padding: 15px; border-radius: 16px; }
        .setting-group { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 4px; }
        .setting-group label { font-size: 0.85rem; color: var(--muted); margin-bottom: 0; font-weight: 600; }
        .setting-group input { width: 80px; background: #333; border: 1px solid #444; color: #fff; border-radius: 8px; text-align: center; font-size: 1.1rem; font-weight: bold; padding: 2px 4px; }
        .clocks-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 8px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        @media (min-width: 480px) { .clocks-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .clocks-grid .time-display.round { font-size: 3.8rem; } }
        .clock-card { background: var(--card); border-radius: 20px; padding: 10px 15px; box-shadow: 0 6px 15px rgba(0,0,0,0.4); border-top: 6px solid #333; transition: border-top-color 0.3s ease, box-shadow 0.3s ease; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
        .clock-card.work { border-top-color: var(--work); }
        .clock-card.rest { border-top-color: var(--rest); }
        .clocks-grid { cursor: pointer; }
        /* On a wide screen the cards sit side by side and the history below
           them has the same two columns, so the round number in the history
           lines up with the cards. Both grids share the same template, and
           the number column stays empty in the clock grid, which puts the
           two cards to the right of it. */
        @media (min-width: 480px) {
          .clocks-grid { grid-template-columns: 26px 1fr 1fr; column-gap: 12px; }
          .clocks-spacer { grid-column: 1; grid-row: 1; }
          .clock-card.work { grid-column: 2; grid-row: 1; }
          .clock-card.rest { grid-column: 3; grid-row: 1; }
        }
        @keyframes glowWork { 0%, 100% { box-shadow: 0 0 10px 2px rgba(76, 175, 80, 0.45), 0 6px 15px rgba(0,0,0,0.4); } 50% { box-shadow: 0 0 40px 8px rgba(76, 175, 80, 0.95), 0 6px 15px rgba(0,0,0,0.4); } }
        @keyframes glowRest { 0%, 100% { box-shadow: 0 0 10px 2px rgba(33, 150, 246, 0.45), 0 6px 15px rgba(0,0,0,0.4); } 50% { box-shadow: 0 0 40px 8px rgba(33, 150, 246, 0.95), 0 6px 15px rgba(0,0,0,0.4); } }
        .clock-card.glow-work { animation: glowWork 2s ease-in-out infinite; }
        .clock-card.glow-rest { animation: glowRest 2s ease-in-out infinite; }
        .clock-card.glow-static { animation: none; }
        .clock-card.glow-static.glow-work { box-shadow: 0 0 40px 8px rgba(76, 175, 80, 0.95), 0 6px 15px rgba(0,0,0,0.4); }
        .clock-card.glow-static.glow-rest { box-shadow: 0 0 40px 8px rgba(33, 150, 246, 0.95), 0 6px 15px rgba(0,0,0,0.4); }
        /* Press feedback is scoped to the tapped card. The click handler is on
           the grid, so without this the browser paints the press state over
           the whole grid and it covers both cards. */
        .clock-card:active { filter: brightness(1.15); }
        .clock-title { font-size: 1.2rem; text-transform: uppercase; margin-bottom: 4px; font-weight: 800; }
        .time-group { margin-bottom: 6px; }
        .time-group:last-child { margin-bottom: 0; }
        .time-label { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 0; font-weight: 600; }
        .time-display { font-family: monospace; font-size: 2.8rem; font-weight: bold; letter-spacing: -1px; line-height: 1.05; transition: color 0.6s ease; }
        .time-display.countdown { font-size: 3.2rem; }
        .time-display.round { font-size: 4.5rem; }
        .time-display.countdown.elapsed { color: #ff5252 !important; }
        .time-display.total { font-size: 1.8rem; color: #dcdcdc; }
        .clock-card.work .time-display.round, .clock-card.work .time-display.countdown { color: var(--work); }
        .clock-card.rest .time-display.round, .clock-card.rest .time-display.countdown { color: var(--rest); }
        .clock-card.inactive .time-display.round, .clock-card.inactive .time-display.countdown, .clock-card.inactive .time-display.total { color: #888; }
        .controls { display: flex; flex-direction: column; gap: 15px; }
        button { font-size: 1.4rem; font-weight: bold; padding: 20px; border: none; border-radius: 50px; cursor: pointer; user-select: none; transition: background 0.2s, transform 0.1s; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        button:active { transform: scale(0.97); }
        .secondary-btns { display: grid; grid-template-columns: 1fr; gap: 15px; }
        #resetBtn { background: #2a1414; color: #ff5252; font-size: 1.1rem; padding: 15px; border: 1px solid #5c1d1d; width: 100%; }
        .preset-btn { background: #333; color: #aaa; border: 1px solid #444; border-radius: 14px; padding: 4px 10px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        /* Pulse the duration input when its value changes, so the new value
           is confirmed visually. */
        @keyframes duration-pulse {
          0% { transform: scale(1); }
          50% { transform: scale(1.25); }
          100% { transform: scale(1); }
        }
        .setting-group input.pulsing { animation: duration-pulse 400ms cubic-bezier(0.34, 1.56, 0.64, 1); }
        @media (prefers-reduced-motion: reduce) { .setting-group input.pulsing { animation: none; } }
        /* The panel has no horizontal padding, so the grid inside has the
           same width as the clock cards above it. */
        .history { background: var(--card); border-radius: 16px; padding: 10px 0; margin-bottom: 15px; text-align: left; width: 100%; }
        .session-total { background: var(--card); border-radius: 16px; padding: 6px 15px; margin-bottom: 8px; text-align: center; width: 100%; font-size: 1.2rem; font-weight: bold; color: var(--text); }
        .history-empty { color: var(--muted); font-size: 0.9rem; padding: 4px 15px; }
        /* Work and rest side by side, so a round can be compared with the
           round that followed it without scrolling. The number is shared by
           both phases: a work round and the rest round that follows it
           count as one round. */
        .history-grid { display: grid; grid-template-columns: 26px 1fr 1fr; gap: 0 12px; }
        .history-n { font-family: monospace; font-size: 0.85rem; color: var(--muted); text-align: right; padding: 6px 8px 6px 0; border-bottom: 1px solid #333; }
        /* Below that the clock cards are stacked, so the history follows the
           same layout. */
        .history-cell { padding: 6px 0 6px 8px; border-bottom: 1px solid #333; border-left: 2px solid transparent; }
        .history-cell.work-col { border-left-color: var(--work); }
        .history-cell.rest-col { border-left-color: var(--rest); }
        .history-cell.empty-cell { border-left-color: #333; }
        .history-grid > :nth-last-child(-n+3) { border-bottom: none; }
        .history-actual { display: block; font-family: monospace; font-size: 1rem; color: var(--text); line-height: 1.1; white-space: nowrap; }
        .history-planned { display: block; font-family: monospace; font-size: 0.72rem; color: #777; line-height: 1.1; white-space: nowrap; padding-top: 2px; margin-top: 2px; border-top: 1px solid #2a2a2a; }
        /* Below that the clock cards are stacked, so the two phases of a
           round are stacked as well. The work entry of a round carries the
           number, and the border between the two entries of a round is
           removed so they read as one group. */
        @media (max-width: 479px) {
          .history-grid { grid-template-columns: 26px 1fr; gap: 0 12px; }
          .history-cell.work-col { grid-column: 2; }
          .history-cell.rest-col { grid-column: 2; }
          .history-n { grid-column: 1; }
          .history-cell.rest-col { border-bottom: 1px solid #333; }
          .history-cell.rest-col + .history-n { border-bottom: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="status" class="status-badge">Готово до старту</div>
        <div class="clocks-grid" id="clocksGrid">
            <div class="clocks-spacer" aria-hidden="true"></div>
            <div class="clock-card work">
                <div class="clock-title">💼 РОБОТА</div>
                <div class="time-group"><div id="work-round" class="time-display round">00:00.0</div></div>
                <div class="time-group"><span class="time-label">ЗВОРОТНІЙ ВІДЛІК</span><div class="setting-group"><input type="number" id="workDurationInput" min="1" value="45"> <span>сек</span></div><div id="work-countdown" class="time-display countdown">00:45.0</div></div>
                <div class="time-group"><span class="time-label">ЗАГАЛЬНИЙ ЧАС</span><div id="work-total" class="time-display total">00:00.0</div></div>
            </div>
            <div class="clock-card rest">
                <div class="clock-title">☕ ВІДПОЧИНОК</div>
                <div class="time-group"><div id="rest-round" class="time-display round">00:00.0</div></div>
                <div class="time-group"><span class="time-label">ЗВОРОТНІЙ ВІДЛІК</span><div class="setting-group"><input type="number" id="restDurationInput" min="1" value="60"> <span>сек</span></div><div id="rest-countdown" class="time-display countdown">01:00.0</div></div>
                <div class="time-group"><span class="time-label">ЗАГАЛЬНИЙ ЧАС</span><div id="rest-total" class="time-display total">00:00.0</div></div>
            </div>
        </div>
        <div id="sessionTotal" class="session-total">Загальний час сесії: 00:00.0</div>
        <div class="history" id="history"></div>
        <div class="controls">
            <div class="secondary-btns"><button id="resetBtn">Скинути все</button></div>
        </div>
    </div>


    <script>
        let state = 'IDLE', previousState = 'WORK';
        let timers = { workTotal: 0, workRound: 0, restTotal: 0, restRound: 0 };
        let history = [];
        let quickDurations = { WORK: [45, 60, 120], REST: [45, 60, 120] };
        let lastUpdateTime = 0, intervalId = null, audioCtx = null;
        let config = { workDuration: 45000, restDuration: 60000 }, currentSignalStep = 0;
        // Planned duration of the round that is currently running. It is
        // captured when the round starts, so changing the configured
        // duration later does not change the countdown or the history entry
        // for a round that is already under way.
        let roundDuration = { WORK: 0, REST: 0 };
        function loadSettings() {
            const w = localStorage.getItem('sw_w'), r = localStorage.getItem('sw_r');
            if (w) { document.getElementById('workDurationInput').value = w; config.workDuration = parseInt(w) * 1000; }
            if (r) { document.getElementById('restDurationInput').value = r; config.restDuration = parseInt(r) * 1000; }
        }
        function saveSettings() {
            const w = document.getElementById('workDurationInput').value, r = document.getElementById('restDurationInput').value;
            localStorage.setItem('sw_w', w); localStorage.setItem('sw_r', r);
            config.workDuration = (parseInt(w) || 45) * 1000; config.restDuration = (parseInt(r) || 60) * 1000;
            if (state === 'IDLE') updateDisplays();
        }
        function saveSnapshot() {
            try { localStorage.setItem('sw_state', JSON.stringify({ state: state, previousState: previousState, timers: timers, currentSignalStep: currentSignalStep, lastUpdateTime: lastUpdateTime, history: history, quickDurations: quickDurations, roundDuration: roundDuration })); } catch (e) { /* storage full/blocked */ }
        }
        function restoreState() {
            try {
                const s = JSON.parse(localStorage.getItem('sw_state'));
                if (s && (s.state === 'WORK' || s.state === 'REST' || s.state === 'PAUSED')) {
                    state = s.state; previousState = s.previousState || 'WORK'; timers = s.timers || { workTotal: 0, workRound: 0, restTotal: 0, restRound: 0 }; currentSignalStep = s.currentSignalStep || 0; lastUpdateTime = s.lastUpdateTime || Date.now(); history = s.history || []; quickDurations = s.quickDurations || { WORK: [45, 60, 120], REST: [45, 60, 120] };
                    // The plan of a round that is under way survives a reload.
                    roundDuration = s.roundDuration || { WORK: 0, REST: 0 };
                    return true;
                }
            } catch (e) { /* corrupted snapshot -> fall through to fresh start */ }
            return false;
        }
        function playBeep(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator(), gain = audioCtx.createGain(); osc.type = 'sine';
                if (type === 'action') { osc.frequency.setValueAtTime(600, audioCtx.currentTime); gain.gain.setValueAtTime(0.08, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.12); }
                else if (type === 'alert-prep') { osc.frequency.setValueAtTime(880, audioCtx.currentTime); gain.gain.setValueAtTime(0.12, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.15); }
                else if (type === 'alert-final') { osc.frequency.setValueAtTime(440, audioCtx.currentTime); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.6); }
            } catch (e) { console.log(e); }
        }
        function formatTime(ms) {
            const neg = ms < 0; let abs = Math.abs(ms);
            let ts = abs / 1000, m = Math.floor(ts / 60), s = Math.floor(ts % 60), t = Math.floor((abs % 1000) / 100);
            return `${neg ? '-' : ''}${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}.${t}`;
        }
        function updateDisplays() {
            document.getElementById('work-round').innerText = formatTime(timers.workRound);
            document.getElementById('work-total').innerText = formatTime(timers.workTotal);
            document.getElementById('rest-round').innerText = formatTime(timers.restRound);
            document.getElementById('rest-total').innerText = formatTime(timers.restTotal);
            document.getElementById('sessionTotal').innerText = 'Загальний час сесії: ' + formatTime(timers.workTotal + timers.restTotal);
            // A round that has not started yet has no plan of its own, so it
            // shows the currently configured duration.
            let wv = (roundDuration.WORK || config.workDuration) - timers.workRound;
            let rv = (roundDuration.REST || config.restDuration) - timers.restRound;
            let we = document.getElementById('work-countdown'), re = document.getElementById('rest-countdown');
            we.innerText = formatTime(wv); re.innerText = formatTime(rv);
            if (wv < 0) we.classList.add('elapsed'); else we.classList.remove('elapsed');
            if (rv < 0) re.classList.add('elapsed'); else re.classList.remove('elapsed');
        }
        function tick() {
            const now = Date.now(), delta = now - lastUpdateTime; lastUpdateTime = now;
            if (state === 'WORK') {
                timers.workRound += delta; timers.workTotal += delta;
                let rem = (roundDuration.WORK || config.workDuration) - timers.workRound;
                if (rem <= 2000 && currentSignalStep === 0) { currentSignalStep = 1; playBeep('alert-prep'); }
                else if (rem <= 1000 && currentSignalStep === 1) { currentSignalStep = 2; playBeep('alert-prep'); }
                else if (rem <= 0 && currentSignalStep === 2) { currentSignalStep = 3; playBeep('alert-final'); }
            } else if (state === 'REST') {
                timers.restRound += delta; timers.restTotal += delta;
                let rem = (roundDuration.REST || config.restDuration) - timers.restRound;
                if (rem <= 2000 && currentSignalStep === 0) { currentSignalStep = 1; playBeep('alert-prep'); }
                else if (rem <= 1000 && currentSignalStep === 1) { currentSignalStep = 2; playBeep('alert-prep'); }
                else if (rem <= 0 && currentSignalStep === 2) { currentSignalStep = 3; playBeep('alert-final'); }
            }
            updateDisplays();
        }
        function startTicker(since) { if (intervalId) clearInterval(intervalId); lastUpdateTime = since || Date.now(); intervalId = setInterval(tick, 100); }
        function updateGlow() {
            document.querySelectorAll('.clock-card').forEach(card => {
                card.classList.remove('glow-work', 'glow-rest', 'glow-static', 'inactive');
                const phase = state === 'PAUSED' ? previousState : state;
                const isCurrent = card.classList.contains(phase === 'WORK' ? 'work' : 'rest');
                if (isCurrent) {
                    if (state === 'PAUSED') { card.classList.add('glow-static'); card.classList.add(phase === 'WORK' ? 'glow-work' : 'glow-rest'); }
                    else card.classList.add(phase === 'WORK' ? 'glow-work' : 'glow-rest');
                } else {
                    card.classList.add('inactive');
                }
            });
        }
        function addQuickDuration(phase, seconds) {
            const list = quickDurations[phase] || (quickDurations[phase] = []);
            const idx = list.indexOf(seconds);
            if (idx !== -1) { list.splice(idx, 1); list.unshift(seconds); }
            else { if (list.length >= 3) list.pop(); list.unshift(seconds); }
            return list;
        }
        function applyQuickDuration(phase, seconds) {
            if (phase === 'WORK') { config.workDuration = seconds * 1000; document.getElementById('workDurationInput').value = seconds; }
            else { config.restDuration = seconds * 1000; document.getElementById('restDurationInput').value = seconds; }
            addQuickDuration(phase, seconds);
            renderQuickDurations();
            pulseDurationInput(phase);
            if (state === 'IDLE') updateDisplays();
        }
        // Pulse the duration input to highlight the value that was just
        // picked. The input element survives a re-render, so it can be
        // animated in place.
        function pulseDurationInput(phase) {
            const input = document.getElementById(phase === 'WORK' ? 'workDurationInput' : 'restDurationInput');
            if (!input) return;
            input.classList.remove('pulsing');
            // Force a reflow so the animation restarts when the same preset
            // is picked again in a row.
            void input.offsetWidth;
            input.classList.add('pulsing');
            input.addEventListener('animationend', function handler() {
                input.classList.remove('pulsing');
                input.removeEventListener('animationend', handler);
            });
        }
        function renderQuickDurations() {
            ['WORK', 'REST'].forEach(function(phase) {
                const card = phase === 'WORK' ? document.querySelector('.clock-card.work') : document.querySelector('.clock-card.rest');
                const group = card ? card.querySelector('.setting-group') : null;
                if (!group) return;
                const input = document.getElementById(phase === 'WORK' ? 'workDurationInput' : 'restDurationInput');
                group.innerHTML = '';
                quickDurations[phase].slice().sort((a, b) => a - b).forEach(function(seconds) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'preset-btn';
                    btn.dataset.phase = phase;
                    btn.dataset.value = seconds;
                    btn.innerText = seconds;
                    btn.addEventListener('click', function() { applyQuickDuration(phase, seconds); });
                    group.appendChild(btn);
                });
                if (input) { group.appendChild(input); const s = document.createElement('span'); s.innerText = 'сек'; group.appendChild(s); }
            });
        }
        function renderHistory() {
            const container = document.getElementById('history');
            if (!container) return;
            container.innerHTML = '';
            if (!history.length) {
                const empty = document.createElement('div');
                empty.className = 'history-empty';
                empty.innerText = 'Ще немає завершених раундів';
                container.appendChild(empty);
                return;
            }
            // Work and rest are shown side by side, so a round can be
            // compared with the round of the other phase that followed it.
            // The rounds of each phase are paired up by their position, and
            // a work round together with the rest round that follows it
            // count as one round.
            const workRounds = history.filter(function(h) { return h.phase === 'WORK'; });
            const restRounds = history.filter(function(h) { return h.phase === 'REST'; });
            const rowCount = Math.max(workRounds.length, restRounds.length);

            const grid = document.createElement('div');
            grid.className = 'history-grid';

            function makeCell(round, phaseClass) {
                const cell = document.createElement('div');
                cell.className = 'history-cell ' + phaseClass;
                if (!round) {
                    cell.classList.add('empty-cell');
                    return cell;
                }
                const actual = document.createElement('span');
                actual.className = 'history-actual';
                actual.innerText = formatTime(round.duration);
                const planned = document.createElement('span');
                planned.className = 'history-planned';
                planned.innerText = formatTime(round.planned);
                cell.appendChild(actual);
                cell.appendChild(planned);
                return cell;
            }

            for (let i = 0; i < rowCount; i++) {
                const n = document.createElement('div');
                n.className = 'history-n';
                n.innerText = i + 1;
                grid.appendChild(n);
                grid.appendChild(makeCell(workRounds[i], 'work-col'));
                grid.appendChild(makeCell(restRounds[i], 'rest-col'));
            }
            container.appendChild(grid);
        }
        function handleAction(phase) {
            playBeep('action'); const se = document.getElementById('status');
            if (state === 'IDLE') {
                state = phase;
                if (phase === 'WORK') timers.workRound = 0; else timers.restRound = 0;
                // A new round starts, so it takes the currently configured
                // duration as its plan.
                roundDuration[phase] = phase === 'WORK' ? config.workDuration : config.restDuration;
                if (phase === 'WORK') { se.innerText = "Іде робота"; se.className = "status-badge work-active"; }
                else { se.innerText = "Іде відпочинок"; se.className = "status-badge rest-active"; }
                addQuickDuration(phase, (phase === 'WORK' ? config.workDuration : config.restDuration) / 1000);
                renderQuickDurations();
                startTicker();
            } else if (state === 'PAUSED') {
                const resume = (phase === previousState);
                if (!resume) {
                    // Switching to the other phase starts a new round there.
                    if (phase === 'WORK') timers.workRound = 0; else timers.restRound = 0;
                    roundDuration[phase] = phase === 'WORK' ? config.workDuration : config.restDuration;
                }
                // Resuming keeps the plan the round was started with.
                state = phase;
                if (phase === 'WORK') { se.innerText = "Іде робота"; se.className = "status-badge work-active"; }
                else { se.innerText = "Іде відпочинок"; se.className = "status-badge rest-active"; }
                addQuickDuration(phase, (phase === 'WORK' ? config.workDuration : config.restDuration) / 1000);
                renderQuickDurations();
                startTicker();
            } else if (phase === state) {
                playBeep('action'); previousState = state; state = 'PAUSED'; if (intervalId) clearInterval(intervalId);
                se.innerText = "Пауза"; se.className = "status-badge paused";
            } else {
                // The planned duration is stored with the record, so changing
                // the configured duration later does not rewrite the history.
                history.push({
                    phase: state,
                    duration: state === 'WORK' ? timers.workRound : timers.restRound,
                    planned: (state === 'WORK' ? roundDuration.WORK : roundDuration.REST) || (state === 'WORK' ? config.workDuration : config.restDuration)
                });
                state = phase; if (phase === 'WORK') timers.workRound = 0; else timers.restRound = 0;
                currentSignalStep = 0;
                // The phase that is being switched to starts a new round.
                roundDuration[phase] = phase === 'WORK' ? config.workDuration : config.restDuration;
                if (phase === 'WORK') { se.innerText = "Іде робота"; se.className = "status-badge work-active"; }
                else { se.innerText = "Іде відпочинок"; se.className = "status-badge rest-active"; }
                lastUpdateTime = Date.now();
                addQuickDuration(phase, (phase === 'WORK' ? config.workDuration : config.restDuration) / 1000);
                renderQuickDurations();
                startTicker();
            }
            updateGlow();
            updateDisplays();
            renderHistory();
        }
        function handleReset() {
            if (intervalId) clearInterval(intervalId); intervalId = null; state = 'IDLE'; previousState = 'WORK'; currentSignalStep = 0;
            timers = { workTotal: 0, workRound: 0, restTotal: 0, restRound: 0 };
            roundDuration = { WORK: 0, REST: 0 };
            history = [];
            const se = document.getElementById('status'); se.innerText = "Готово до старту"; se.className = "status-badge";
            saveSnapshot();
            renderHistory();
            updateGlow();
            updateDisplays();
        }
        document.addEventListener("DOMContentLoaded", function() {
            loadSettings();
            if (!restoreState()) { state = 'IDLE'; previousState = 'WORK'; timers = { workTotal: 0, workRound: 0, restTotal: 0, restRound: 0 }; currentSignalStep = 0; }
            if (state !== 'IDLE') startTicker(lastUpdateTime);
            updateGlow();
            if (state !== 'IDLE') {
                const se = document.getElementById('status');
                if (state === 'WORK') { se.innerText = "Іде робота"; se.className = "status-badge work-active"; }
                else { se.innerText = "Іде відпочинок"; se.className = "status-badge rest-active"; }
            }
            updateDisplays();
            renderHistory();
            renderQuickDurations();
            document.getElementById('clocksGrid').addEventListener('click', function(e) {
                if (e.target.closest && e.target.closest('input, button, a, select, textarea')) return;
                const card = e.target.closest ? e.target.closest('.clock-card') : null;
                if (!card) return;
                handleAction(card.classList.contains('work') ? 'WORK' : 'REST');
            });
            document.getElementById('resetBtn').addEventListener('click', handleReset);
            document.getElementById('workDurationInput').addEventListener('input', saveSettings);
            document.getElementById('restDurationInput').addEventListener('input', saveSettings);
            document.addEventListener('visibilitychange', function() { if (document.visibilityState === 'hidden') saveSnapshot(); });
            window.addEventListener('pagehide', saveSnapshot);
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' }).then(function(reg) {
                        // Ask the worker to check the server for a newer deploy.
                        function checkForUpdate() {
                            if (reg.active) reg.active.postMessage('check-update');
                        }
                        checkForUpdate();
                        // Check on every return to the app, so a phone that was
                        // left open in the background picks up a new deploy.
                        document.addEventListener('visibilitychange', function() {
                            if (document.visibilityState === 'visible') checkForUpdate();
                        });
                        setInterval(checkForUpdate, 30 * 60 * 1000);
                    });
                });
            }
            document.addEventListener('keyup', function(e) { if (e.code === 'Space' || e.keyCode === 32) { if (e.target.tagName === 'INPUT') return; let phase = state; if (phase === 'PAUSED') phase = previousState; handleAction(phase); } });
        });
    </script>
</body>
</html>
