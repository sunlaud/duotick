name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Allows deploying manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, and do not cancel a deployment that
# is already running, so a push does not interrupt a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          # The app is the whole repository. The .tmp folder is not tracked
          # and the .git folder is never uploaded, so this is the site as it
          # is served.
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
