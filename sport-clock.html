<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таймер та Секундомір</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #fff; --muted: #aaa; --work: #4caf50; --rest: #2196f3; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 600px; text-align: center; }
        .status-badge { font-size: 1.6rem; font-weight: bold; margin-bottom: 20px; padding: 12px 25px; border-radius: 30px; display: inline-block; text-transform: uppercase; background: #333; color: var(--muted); }
        .status-badge.work-active { background: var(--work); color: #000; }
        .status-badge.rest-active { background: var(--rest); color: #000; }
        .status-badge.paused { background: #ff9800; color: #000; }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; background: var(--card); padding: 15px; border-radius: 16px; }
        .setting-group { display: flex; flex-direction: column; align-items: center; }
        .setting-group label { font-size: 0.85rem; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
        .setting-group input { width: 80px; background: #333; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 8px; text-align: center; font-size: 1.1rem; font-weight: bold; }
        .clocks-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 25px; }
        @media (min-width: 480px) { .clocks-grid { grid-template-columns: 1fr 1fr; } }
        .clock-card { background: var(--card); border-radius: 20px; padding: 20px 15px; box-shadow: 0 6px 15px rgba(0,0,0,0.4); border-top: 6px solid #333; transition: border-top-color 0.3s ease, box-shadow 0.3s ease; }
        .clock-card.work { border-top-color: var(--work); }
        .clock-card.rest { border-top-color: var(--rest); }
        .clocks-grid { cursor: pointer; }
        @keyframes glowWork { 0%, 100% { box-shadow: 0 0 10px 2px rgba(76, 175, 80, 0.45), 0 6px 15px rgba(0,0,0,0.4); } 50% { box-shadow: 0 0 40px 8px rgba(76, 175, 80, 0.95), 0 6px 15px rgba(0,0,0,0.4); } }
        @keyframes glowRest { 0%, 100% { box-shadow: 0 0 10px 2px rgba(33, 150, 246, 0.45), 0 6px 15px rgba(0,0,0,0.4); } 50% { box-shadow: 0 0 40px 8px rgba(33, 150, 246, 0.95), 0 6px 15px rgba(0,0,0,0.4); } }
        .clock-card.glow-work { animation: glowWork 2s ease-in-out infinite; }
        .clock-card.glow-rest { animation: glowRest 2s ease-in-out infinite; }
        .clock-card.glow-static { animation: none; }
        .clock-card.glow-static.glow-work { box-shadow: 0 0 18px 4px rgba(76, 175, 80, 0.7), 0 6px 15px rgba(0,0,0,0.4); }
        .clock-card.glow-static.glow-rest { box-shadow: 0 0 18px 4px rgba(33, 150, 246, 0.7), 0 6px 15px rgba(0,0,0,0.4); }
        .clock-title { font-size: 1.2rem; text-transform: uppercase; margin-bottom: 15px; font-weight: 800; }
        .time-group { margin-bottom: 15px; }
        .time-label { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 2px; font-weight: 600; }
        .time-display { font-family: monospace; font-size: 2.8rem; font-weight: bold; letter-spacing: -1px; transition: color 0.6s ease; }
        .time-display.countdown { font-size: 3.2rem; }
        .time-display.round { font-size: 3.84rem; }
        .time-display.countdown.elapsed { color: #ff5252 !important; }
        .time-display.total { font-size: 1.8rem; color: #dcdcdc; }
        .clock-card.work .time-display.round, .clock-card.work .time-display.countdown { color: var(--work); }
        .clock-card.rest .time-display.round, .clock-card.rest .time-display.countdown { color: var(--rest); }
        .clock-card.inactive .time-display.round, .clock-card.inactive .time-display.countdown, .clock-card.inactive .time-display.total { color: #888; }
        .controls { display: flex; flex-direction: column; gap: 15px; }
        button { font-size: 1.4rem; font-weight: bold; padding: 20px; border: none; border-radius: 50px; cursor: pointer; user-select: none; transition: background 0.2s, transform 0.1s; }
        button:active { transform: scale(0.97); }
        .secondary-btns { display: grid; grid-template-columns: 1fr; gap: 15px; }
        #resetBtn { background: #2a1414; color: #ff5252; font-size: 1.1rem; padding: 15px; border: 1px solid #5c1d1d; }
    </style>
</head>
<body>
    <div class="container">
        <div id="status" class="status-badge">Готово до старту</div>
        <div class="settings-grid">
            <div class="setting-group"><label for="workDurationInput">⏱️ Робота (сек)</label><input type="number" id="workDurationInput" min="1" value="45"></div>
            <div class="setting-group"><label for="restDurationInput">⏱️ Відпочинок (сек)</label><input type="number" id="restDurationInput" min="1" value="60"></div>
        </div>
        <div class="clocks-grid" id="clocksGrid">
            <div class="clock-card work">
                <div class="clock-title">💼 РОБОТА</div>
                <div class="time-group"><span class="time-label">ПОТОЧНИЙ РАУНД</span><div id="work-round" class="time-display round">00:00.0</div></div>
                <div class="time-group"><span class="time-label">ЗВОРОТНІЙ ВІДЛІК</span><div id="work-countdown" class="time-display countdown">00:45.0</div></div>
                <div class="time-group"><span class="time-label">ЗАГАЛЬНИЙ ЧАС</span><div id="work-total" class="time-display total">00:00.0</div></div>
            </div>
            <div class="clock-card rest">
                <div class="clock-title">☕ ВІДПОЧИНОК</div>
                <div class="time-group"><span class="time-label">ПОТОЧНИЙ РАУНД</span><div id="rest-round" class="time-display round">00:00.0</div></div>
                <div class="time-group"><span class="time-label">ЗВОРОТНІЙ ВІДЛІК</span><div id="rest-countdown" class="time-display countdown">01:00.0</div></div>
                <div class="time-group"><span class="time-label">ЗАГАЛЬНИЙ ЧАС</span><div id="rest-total" class="time-display total">00:00.0</div></div>
            </div>
        </div>
        <div class="controls">
            <div class="secondary-btns"><button id="resetBtn">Скинути все</button></div>
        </div>
    </div>


    <script>
        let state = 'IDLE', previousState = 'WORK';
        let timers = { workTotal: 0, workRound: 0, restTotal: 0, restRound: 0 };
        let lastUpdateTime = 0, intervalId = null, audioCtx = null;
        let config = { workDuration: 45000, restDuration: 60000 }, currentSignalStep = 0;
        function loadSettings() {
            const w = localStorage.getItem('sw_w'), r = localStorage.getItem('sw_r');
            if (w) { document.getElementById('workDurationInput').value = w; config.workDuration = parseInt(w) * 1000; }
            if (r) { document.getElementById('restDurationInput').value = r; config.restDuration = parseInt(r) * 1000; }
        }
        function saveSettings() {
            const w = document.getElementById('workDurationInput').value, r = document.getElementById('restDurationInput').value;
            localStorage.setItem('sw_w', w); localStorage.setItem('sw_r', r);
            config.workDuration = (parseInt(w) || 45) * 1000; config.restDuration = (parseInt(r) || 60) * 1000;
            if (state === 'IDLE') updateDisplays();
        }
        function saveSnapshot() {
            try { localStorage.setItem('sw_state', JSON.stringify({ state: state, previousState: previousState, timers: timers, currentSignalStep: currentSignalStep, lastUpdateTime: lastUpdateTime })); } catch (e) { /* storage full/blocked */ }
        }
        function restoreState() {
            try {
                const s = JSON.parse(localStorage.getItem('sw_state'));
                if (s && (s.state === 'WORK' || s.state === 'REST' || s.state === 'PAUSED')) {
                    state = s.state; previousState = s.previousState || 'WORK'; timers = s.timers || { workTotal: 0, workRound: 0, restTotal: 0, restRound: 0 }; currentSignalStep = s.currentSignalStep || 0; lastUpdateTime = s.lastUpdateTime || Date.now();
                    return true;
                }
            } catch (e) { /* corrupted snapshot -> fall through to fresh start */ }
            return false;
        }
        function playBeep(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator(), gain = audioCtx.createGain(); osc.type = 'sine';
                if (type === 'action') { osc.frequency.setValueAtTime(600, audioCtx.currentTime); gain.gain.setValueAtTime(0.08, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.12); }
                else if (type === 'alert-prep') { osc.frequency.setValueAtTime(880, audioCtx.currentTime); gain.gain.setValueAtTime(0.12, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.15); }
                else if (type === 'alert-final') { osc.frequency.setValueAtTime(440, audioCtx.currentTime); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.6); }
            } catch (e) { console.log(e); }
        }
        function formatTime(ms) {
            const neg = ms < 0; let abs = Math.abs(ms);
            let ts = abs / 1000, m = Math.floor(ts / 60), s = Math.floor(ts % 60), t = Math.floor((abs % 1000) / 100);
            return `${neg ? '-' : ''}${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}.${t}`;
        }
        function updateDisplays() {
            document.getElementById('work-round').innerText = formatTime(timers.workRound);
            document.getElementById('work-total').innerText = formatTime(timers.workTotal);
            document.getElementById('rest-round').innerText = formatTime(timers.restRound);
            document.getElementById('rest-total').innerText = formatTime(timers.restTotal);
            let wv = config.workDuration - timers.workRound, rv = config.restDuration - timers.restRound;
            let we = document.getElementById('work-countdown'), re = document.getElementById('rest-countdown');
            we.innerText = formatTime(wv); re.innerText = formatTime(rv);
            if (wv < 0) we.classList.add('elapsed'); else we.classList.remove('elapsed');
            if (rv < 0) re.classList.add('elapsed'); else re.classList.remove('elapsed');
        }
        function tick() {
            const now = Date.now(), delta = now - lastUpdateTime; lastUpdateTime = now;
            if (state === 'WORK') {
                timers.workRound += delta; timers.workTotal += delta;
                let rem = config.workDuration - timers.workRound;
                if (rem <= 2000 && currentSignalStep === 0) { currentSignalStep = 1; playBeep('alert-prep'); }
                else if (rem <= 1000 && currentSignalStep === 1) { currentSignalStep = 2; playBeep('alert-prep'); }
                else if (rem <= 0 && currentSignalStep === 2) { currentSignalStep = 3; playBeep('alert-final'); }
            } else if (state === 'REST') {
                timers.restRound += delta; timers.restTotal += delta;
                let rem = config.restDuration - timers.restRound;
                if (rem <= 2000 && currentSignalStep === 0) { currentSignalStep = 1; playBeep('alert-prep'); }
                else if (rem <= 1000 && currentSignalStep === 1) { currentSignalStep = 2; playBeep('alert-prep'); }
                else if (rem <= 0 && currentSignalStep === 2) { currentSignalStep = 3; playBeep('alert-final'); }
            }
            updateDisplays();
        }
        function startTicker(since) { if (intervalId) clearInterval(intervalId); lastUpdateTime = since || Date.now(); intervalId = setInterval(tick, 100); }
        function updateGlow() {
            document.querySelectorAll('.clock-card').forEach(card => {
                card.classList.remove('glow-work', 'glow-rest', 'glow-static', 'inactive');
                const phase = state === 'PAUSED' ? previousState : state;
                const isCurrent = card.classList.contains(phase === 'WORK' ? 'work' : 'rest');
                if (isCurrent) {
                    if (state === 'PAUSED') { card.classList.add('glow-static'); card.classList.add(phase === 'WORK' ? 'glow-work' : 'glow-rest'); }
                    else card.classList.add(phase === 'WORK' ? 'glow-work' : 'glow-rest');
                } else {
                    card.classList.add('inactive');
                }
            });
        }
        function handleAction(phase) {
            playBeep('action'); const se = document.getElementById('status');
            if (state === 'IDLE') {
                state = phase;
                if (phase === 'WORK') timers.workRound = 0; else timers.restRound = 0;
                if (phase === 'WORK') { se.innerText = "Іде робота"; se.className = "status-badge work-active"; }
                else { se.innerText = "Іде відпочинок"; se.className = "status-badge rest-active"; }
                startTicker();
            } else if (state === 'PAUSED') {
                const resume = (phase === previousState);
                if (!resume) { if (phase === 'WORK') timers.workRound = 0; else timers.restRound = 0; }
                state = phase;
                if (phase === 'WORK') { se.innerText = "Іде робота"; se.className = "status-badge work-active"; }
                else { se.innerText = "Іде відпочинок"; se.className = "status-badge rest-active"; }
                startTicker();
            } else if (phase === state) {
                playBeep('action'); previousState = state; state = 'PAUSED'; if (intervalId) clearInterval(intervalId);
                se.innerText = "Пауза"; se.className = "status-badge paused";
            } else {
                state = phase; if (phase === 'WORK') timers.workRound = 0; else timers.restRound = 0;
                currentSignalStep = 0;
                if (phase === 'WORK') { se.innerText = "Іде робота"; se.className = "status-badge work-active"; }
                else { se.innerText = "Іде відпочинок"; se.className = "status-badge rest-active"; }
                lastUpdateTime = Date.now();
                startTicker();
            }
            updateGlow();
            updateDisplays();
        }
        function handleReset() {
            if (intervalId) clearInterval(intervalId); intervalId = null; state = 'IDLE'; previousState = 'WORK'; currentSignalStep = 0;
            timers = { workTotal: 0, workRound: 0, restTotal: 0, restRound: 0 };
            const se = document.getElementById('status'); se.innerText = "Готово до старту"; se.className = "status-badge";
            saveSnapshot();
            updateGlow();
            updateDisplays();
        }
        document.addEventListener("DOMContentLoaded", function() {
            loadSettings();
            if (!restoreState()) { state = 'IDLE'; previousState = 'WORK'; timers = { workTotal: 0, workRound: 0, restTotal: 0, restRound: 0 }; currentSignalStep = 0; }
            if (state !== 'IDLE') startTicker(lastUpdateTime);
            document.getElementById('clocksGrid').addEventListener('click', function(e) {
                const card = e.target.closest ? e.target.closest('.clock-card') : null;
                if (!card) return;
                handleAction(card.classList.contains('work') ? 'WORK' : 'REST');
            });
            document.getElementById('resetBtn').addEventListener('click', handleReset);
            document.getElementById('workDurationInput').addEventListener('input', saveSettings);
            document.getElementById('restDurationInput').addEventListener('input', saveSettings);
            document.addEventListener('visibilitychange', function() { if (document.visibilityState === 'hidden') saveSnapshot(); });
            window.addEventListener('pagehide', saveSnapshot);
            document.addEventListener('keyup', function(e) { if (e.code === 'Space' || e.keyCode === 32) { if (e.target.tagName === 'INPUT') return; let phase = state; if (phase === 'PAUSED') phase = previousState; handleAction(phase); } });
        });
    </script>
</body>
</html>
